[build]
command = "npm run build:client"
publish = "dist/spa"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "24"

[functions]
node_bundler = "esbuild"

# Netlify Server owns dynamic routes and the /api/* backend. Static assets are
# served by Netlify's CDN before requests reach this persistent Node server.
[server]
path = "/*"
region = "fra"
size = "small"

[server.scale]
min = 0
max = 1
